services:
  - type: web
    name: ai-trade-assistant-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_PROVIDER
        value: yahoo
      - key: SUPABASE_URL
        value: https://xiblqetehrnprycbkwyp.supabase.co
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false
      - key: BITKUB_API_KEY
        sync: false
      - key: BITKUB_API_SECRET
        sync: false
      - key: BITKUB_REAL_TRADING_ENABLED
        value: "false"
