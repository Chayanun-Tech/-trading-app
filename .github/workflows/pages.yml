name: Deploy frontend to GitHub Pages

on:
  push:
    branches: ["main", "claude/trading-app-design-1pmpxo"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure API URL
        run: |
          API_URL="${{ vars.API_BASE_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL=""
          fi
          printf 'window.API_BASE_URL = "%s";\n' "$API_URL" > frontend/config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
